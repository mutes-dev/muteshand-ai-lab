[package]
name = "ai-lab-gui"
version = "0.1.0"
description = "AI Lab Desktop GUI"
authors = ["MutesHand"]
edition = "2021"

[lib]
name = "ai_lab_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "ai-lab-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
